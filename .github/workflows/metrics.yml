name: Generate dynamic profile metrics

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Generate Lowlighter Metrics profile
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: DhiranReddy
          filename: github-metrics.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_twemoji: yes
          config_octicon: yes
          config_order: base.header, pagespeed, isocalendar, habits, repositories, languages, topics
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories_forks: yes
          plugins_errors_fatal: no

          plugin_pagespeed: yes
          plugin_pagespeed_url: https://dhiranreddy.cyou
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
          plugin_pagespeed_detailed: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_habits: yes
          plugin_habits_from: 500
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_trim: yes

          plugin_repositories: yes
          plugin_repositories_featured: >-
            DhiranReddy/atlas-engineering-case-study,
            DhiranReddy/vector-daily-engineering-case-study

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_other: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage

          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          plugin_topics_limit: 18

