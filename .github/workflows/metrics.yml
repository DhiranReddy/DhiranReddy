name: Generate profile metrics

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate GitHub profile dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: DhiranReddy
          filename: github-metrics.svg
          committer_branch: main
          committer_message: "chore: refresh profile metrics"
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_padding: 12, 18
          config_output: svg
          config_twemoji: yes
          config_octicon: yes
          config_animations: yes
          base: header, activity, community, repositories, metadata
          repositories_forks: yes

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 28
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_other: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: yes

          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 1

          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          plugin_topics_limit: 16

          plugin_pagespeed: yes
          plugin_pagespeed_url: https://dhiranreddy.cyou
          plugin_pagespeed_detailed: yes

